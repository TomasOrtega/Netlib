[project]
name = "netlib-tools"
version = "0.3.0"
description = "Check and publish Netlib source and documentation."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".lake", "build", "docbuild/.lake"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "prek==0.5.9",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]
