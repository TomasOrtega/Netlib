# Netlib AP configuration subset 1. This is not a product approval.
interface=wlan0
ssid=Netlib-Enterprise
driver=nl80211
hw_mode=a
channel=36
country_code=US
wpa=2
wpa_key_mgmt=WPA-EAP-SUITE-B-192
ieee80211w=2
rsn_pairwise=GCMP-256
group_mgmt_cipher=BIP-GMAC-256
wpa_ptk_rekey=3600
ieee8021x=0
eap_server=0
auth_server_addr=192.0.2.10
auth_server_port=1812
auth_server_shared_secret=example-only-secret
ap_isolate=1
auth_algs=1
