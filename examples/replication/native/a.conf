Sync {
 Mode FTFW { CommitTimeout 180 DisableExternalCache Off ACKWindowSize 300 }
 UDP { IPv4_address 10.10.0.1 IPv4_Destination_Address 10.10.0.2 Port 3780 Interface syncl Checksum on }
}
General {
 HashSize 1024 HashLimit 4096
 LogFile /tmp/netlib-replication/a.log
 LockFile /tmp/netlib-replication/a.lock
 UNIX { Path /tmp/netlib-replication/a.ctl }
 Filter From Userspace { Protocol Accept { UDP } Address Ignore { IPv4_address 10.10.0.0/24 } }
}
