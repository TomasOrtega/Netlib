Sync {
 Mode FTFW { CommitTimeout 180 DisableExternalCache Off ACKWindowSize 300 }
 UDP { IPv4_address 10.10.0.2 IPv4_Destination_Address 10.10.0.1 Port 3780 Interface syncr Checksum on }
}
General {
 HashSize 1024 HashLimit 4096
 LogFile /tmp/netlib-safe-handoff/b.log
 LockFile /tmp/netlib-safe-handoff/b.lock
 UNIX { Path /tmp/netlib-safe-handoff/b.ctl }
 Filter From Userspace { Protocol Accept { UDP } Address Ignore { IPv4_address 10.10.0.0/24 } }
}
