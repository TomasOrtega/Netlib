name: Deploy docs
on:
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked prek -a --quiet
      - run: uv run --locked python scripts/check_site.py --extract build/site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
