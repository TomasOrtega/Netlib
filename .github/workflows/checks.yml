name: Check source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked prek -a --quiet
      - run: uv run --locked python scripts/check_site.py
